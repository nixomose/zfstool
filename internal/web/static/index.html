<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>zfstool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0e0f12;
      --bg-elevated: #13151a;
      --surface: #181b22;
      --surface-hover: #1f232c;
      --border: #2a303a;
      --border-accent: #3a4454;
      --text: #e4e2dd;
      --text-secondary: #949089;
      --accent: #b8956c;
      --link: #9eb6d0;
      --link-hover: #c5d6e8;
      --heading: #f0ede6;
      --err: #c97a7a;
      --health-ok: #8faa8a;
      --sidebar-w: 320px;
      --seg-dataset: #b8956c;
      --seg-snap: #8b7bb0;
      --seg-data: #6b8cae;
      --seg-free: #2a303a;
      --seg-zfs: #c4a35a;
      --seg-ext: #5a8f6d;
      --seg-vfat: #7a9bb8;
      --seg-swap: #8a6a7a;
      --seg-lvm: #6a8a7a;
      --seg-part: #7d8fa3;
      --seg-unalloc: #1a1d22;
      --seg-other: #6e7a6a;
      --ui-zoom: 1;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    html { font-size: calc(16px * var(--ui-zoom, 1)); }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      font-size: calc(13px * var(--ui-zoom, 1));
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { color: var(--link-hover); text-decoration: underline; }
    .shell {
      display: flex;
      min-height: 100%;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-resizer {
      flex: 0 0 5px;
      width: 5px;
      margin-left: -1px;
      cursor: col-resize;
      background: transparent;
      position: relative;
      z-index: 4;
      touch-action: none;
    }
    .sidebar-resizer::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 1px;
      width: 1px;
      background: var(--border);
    }
    .sidebar-resizer:hover::after,
    .shell.is-resizing-sidebar .sidebar-resizer::after {
      background: var(--accent);
      width: 2px;
      left: 0.5px;
    }
    .shell.is-resizing-sidebar {
      cursor: col-resize;
      user-select: none;
    }
    .shell.is-resizing-sidebar iframe,
    .shell.is-resizing-sidebar * {
      cursor: col-resize !important;
    }
    .sidebar-brand {
      padding: 0.55rem 0.7rem 0.45rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.4rem;
    }
    .sidebar-brand a {
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      color: var(--heading);
      text-decoration: none;
    }
    .sidebar-brand a:hover { color: var(--accent); text-decoration: none; }
    .conn-pill {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 7.5rem;
    }
    .conn-pill a { color: inherit; }
    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0.35rem 0 0.75rem;
    }
    .nav-static {
      padding: 0.15rem 0.45rem 0.35rem;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .nav-link {
      display: block;
      padding: 0.22rem 0.45rem;
      border-radius: 2px;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 500;
    }
    .nav-link:hover { background: var(--surface-hover); text-decoration: none; color: var(--heading); }
    .nav-link.active { background: var(--surface); color: var(--heading); box-shadow: inset 2px 0 0 var(--accent); }
    .nav-section { margin-top: 0.2rem; }
    .nav-section-head {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      width: 100%;
      padding: 0.28rem 0.5rem;
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      font: inherit;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: left;
    }
    .nav-section-head:hover { color: var(--text); }
    .nav-chevron {
      display: inline-block;
      width: 0.7rem;
      font-size: 0.6rem;
      color: var(--accent);
    }
    .nav-section-body { padding: 0 0.25rem 0.25rem 0.35rem; }
    .nav-item {
      display: block;
      padding: 0.18rem 0.4rem;
      border-radius: 2px;
      font-size: 0.78rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-item:hover { background: var(--surface-hover); text-decoration: none; color: var(--heading); }
    .nav-item.active { background: var(--surface); color: var(--heading); box-shadow: inset 2px 0 0 var(--accent); }
    .nav-item-row {
      display: flex;
      align-items: stretch;
      gap: 0;
    }
    .nav-item-row .nav-twist {
      flex-shrink: 0;
      width: 1.1rem;
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.55rem;
      padding: 0;
    }
    .nav-item-row .nav-twist:hover { color: var(--accent); }
    .nav-item-row .nav-item { flex: 1; min-width: 0; }
    .nav-kids {
      margin: 0 0 0.15rem 1.1rem;
      padding: 0.1rem 0 0.15rem 0.35rem;
      border-left: 1px solid var(--border);
      font-size: 0.72rem;
    }
    .nav-kids a {
      display: block;
      padding: 0.12rem 0.3rem;
      color: var(--link);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-kids .nav-file {
      display: block;
      padding: 0.12rem 0.3rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.72rem;
    }
    .nav-kids .nav-item-row .nav-file {
      flex: 1;
      min-width: 0;
      padding: 0.12rem 0.3rem;
    }
    .nav-kids .nav-kids {
      margin-left: 0.65rem;
    }
    .nav-pool-filter {
      margin: 0.35rem 0.5rem 0.15rem;
      gap: 0.35rem;
    }
    .nav-pool-filter input[type="search"] {
      max-width: none;
      flex: 1 1 auto;
      min-width: 0;
      width: auto;
      font-size: 0.72rem;
      padding: 0.2rem 0.4rem;
    }
    .nav-files-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.22rem;
      flex: 0 0 auto;
      font-size: 0.68rem;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .nav-files-toggle input {
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .nav-files-toggle:hover { color: var(--text); }
    .nav-pool-filter .list-filter-count {
      flex: 0 0 auto;
    }
    .nav-pool-entry[hidden],
    .nav-disk-entry[hidden],
    .nav-volume-entry[hidden] {
      display: none !important;
    }
    .nav-kids > .nav-item-row[hidden],
    .nav-kids > .nav-kids[hidden],
    .nav-kids > a[hidden],
    .nav-kids > .nav-file[hidden],
    .nav-kids > .muted[hidden],
    .nav-kids > .err[hidden],
    .nav-kids > .smart-snip[hidden] {
      display: none !important;
    }
    .nav-kids .smart-snip {
      display: block;
      padding: 0.15rem 0.3rem 0.25rem;
      color: var(--text-secondary);
      line-height: 1.35;
      white-space: normal;
    }
    .nav-kids .smart-snip .ok { color: var(--health-ok); }
    .nav-kids .smart-snip .bad { color: var(--err); }
    .nav-empty { padding: 0.2rem 0.5rem; color: var(--text-secondary); font-size: 0.75rem; }
    .main-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.35rem 0.75rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
    }
    .topbar-meta {
      font-size: 0.72rem;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-exit {
      flex-shrink: 0;
      padding: 0.2rem 0.55rem;
      font-family: inherit;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 2px;
      cursor: pointer;
    }
    .btn-exit:hover { color: var(--text); border-color: var(--border-accent); }
    .btn-exit[hidden] { display: none !important; }
    #crumb {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.28rem 0.75rem;
      font-size: 0.72rem;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      min-height: 1.85rem;
    }
    #crumb.crumb--hidden { display: none; }
    #crumb-path {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .crumb-back {
      flex-shrink: 0;
      padding: 0.12rem 0.45rem;
      font-family: inherit;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 2px;
      cursor: pointer;
    }
    .crumb-back:hover:not(:disabled) {
      color: var(--heading);
      border-color: var(--border-accent);
      background: var(--surface-hover);
    }
    .crumb-back:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .crumb-link { color: var(--link); }
    .crumb-here { color: var(--text); font-weight: 500; }
    .crumb-sep { color: var(--border-accent); margin: 0 0.12em; }
    .tag-media {
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .tag-ssd { color: #9eb6d0; border-color: rgba(158, 182, 208, 0.35); }
    .tag-hdd { color: #c4a35a; border-color: rgba(196, 163, 90, 0.4); }
    .usage-bar-wrap { margin: 0.35rem 0 0.55rem; }
    .usage-bar {
      display: flex;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
      background: var(--bg);
      min-width: 0;
    }
    .usage-bar .seg {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 3px;
      overflow: hidden;
      font-size: 0.62rem;
      font-weight: 500;
      color: var(--bg);
      text-decoration: none;
      border-right: 1px solid rgba(0, 0, 0, 0.28);
      white-space: nowrap;
      padding: 0 0.2rem;
      box-sizing: border-box;
    }
    .usage-bar .seg:last-child { border-right: 0; }
    .usage-bar a.seg:hover {
      filter: brightness(1.12);
      text-decoration: none;
      color: var(--bg);
    }
    .usage-bar .seg.is-free,
    .usage-bar .seg.is-unalloc {
      color: var(--text-secondary);
    }
    .usage-bar .seg.kind-dataset,
    .usage-swatch.kind-dataset { background: var(--seg-dataset); }
    .usage-bar .seg.kind-snap,
    .usage-swatch.kind-snap { background: var(--seg-snap); }
    .usage-bar .seg.kind-data,
    .usage-swatch.kind-data { background: var(--seg-data); }
    .usage-bar .seg.kind-free,
    .usage-bar .seg.is-free,
    .usage-swatch.kind-free { background: var(--seg-free); }
    .usage-bar .seg.kind-zfs,
    .usage-swatch.kind-zfs { background: var(--seg-zfs); }
    .usage-bar .seg.kind-ext,
    .usage-bar .seg.kind-xfs,
    .usage-bar .seg.kind-btrfs,
    .usage-swatch.kind-ext,
    .usage-swatch.kind-xfs,
    .usage-swatch.kind-btrfs { background: var(--seg-ext); }
    .usage-bar .seg.kind-vfat,
    .usage-bar .seg.kind-fat,
    .usage-bar .seg.kind-efi,
    .usage-swatch.kind-vfat,
    .usage-swatch.kind-fat,
    .usage-swatch.kind-efi { background: var(--seg-vfat); }
    .usage-bar .seg.kind-swap,
    .usage-swatch.kind-swap { background: var(--seg-swap); }
    .usage-bar .seg.kind-lvm,
    .usage-bar .seg.kind-crypt,
    .usage-swatch.kind-lvm,
    .usage-swatch.kind-crypt { background: var(--seg-lvm); }
    .usage-bar .seg.kind-part,
    .usage-swatch.kind-part { background: var(--seg-part); }
    .usage-bar .seg.kind-unalloc,
    .usage-bar .seg.is-unalloc,
    .usage-swatch.kind-unalloc { background: var(--seg-unalloc); }
    .usage-bar .seg.kind-other,
    .usage-swatch.kind-other { background: var(--seg-other); }
    .usage-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem 0.7rem;
      margin: 0.28rem 0 0;
      font-size: 0.68rem;
      color: var(--text-secondary);
    }
    .usage-legend a { color: var(--link); }
    .usage-swatch {
      display: inline-block;
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 1px;
      margin-right: 0.25rem;
      vertical-align: -1px;
      border: 1px solid rgba(0, 0, 0, 0.25);
    }
    .usage-bar-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin: 0 0 0.2rem;
    }
    .disk-bar-block { margin: 0 0 0.65rem; }
    .col-resizer {
      position: absolute;
      top: 0;
      right: 0;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      user-select: none;
      z-index: 2;
    }
    .col-resizer:hover,
    body.is-resizing-col .col-resizer {
      background: var(--accent);
      opacity: 0.55;
    }
    body.is-resizing-col,
    body.is-resizing-col * {
      cursor: col-resize !important;
      user-select: none !important;
    }
    table.cols-resized {
      table-layout: fixed;
    }
    table.cols-resized th,
    table.cols-resized td {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #app {
      flex: 1;
      overflow: auto;
      padding: 0.65rem 0.85rem 1.5rem;
    }
    #app.has-split {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .split-view {
      display: flex;
      flex: 1;
      min-height: 0;
      height: 100%;
    }
    .browse-pane {
      width: var(--browse-pane-w, 300px);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--border);
      background: var(--bg-elevated);
      padding: 0.45rem 0.4rem 0.75rem;
    }
    .browse-pane .browse-title {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      padding: 0.15rem 0.35rem 0.35rem;
    }
    .browse-pane .browse-crumbs {
      font-size: 0.72rem;
      color: var(--text-secondary);
      padding: 0 0.35rem 0.4rem;
      word-break: break-all;
    }
    .browse-pane .browse-crumbs a { color: var(--link); }
    .browse-pane .browse-filter {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      margin-bottom: 0;
    }
    .browse-pane .browse-filter .list-filter {
      flex-shrink: 0;
      margin: 0 0.15rem 0.35rem;
    }
    .browse-pane .browse-filter .list-filter input[type="search"] {
      max-width: none;
    }
    .browse-pane .browse-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex: 1;
      min-height: 0;
      overflow: auto;
    }
    .browse-pane .browse-item[hidden],
    .browse-pane .browse-section[hidden] {
      display: none !important;
    }
    .browse-pane .browse-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.22rem 0.35rem;
      border-radius: 2px;
      color: var(--text);
      font-size: 0.78rem;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .browse-pane .browse-item:hover {
      background: var(--surface-hover);
      color: var(--heading);
      text-decoration: none;
    }
    .browse-pane .browse-item.active {
      background: var(--surface);
      color: var(--heading);
      box-shadow: inset 2px 0 0 var(--accent);
    }
    .browse-pane .browse-item .browse-kind {
      flex-shrink: 0;
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
      min-width: 2.2rem;
    }
    .browse-pane .browse-item .browse-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .browse-pane .browse-section {
      margin-top: 0.45rem;
      padding: 0.2rem 0.35rem 0.1rem;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .browse-pane .browse-empty {
      padding: 0.35rem;
      color: var(--text-secondary);
      font-size: 0.75rem;
    }
    .detail-pane {
      flex: 1;
      min-width: 0;
      overflow: auto;
      padding: 0.65rem 0.85rem 1.5rem;
    }
    @media (max-width: 900px) {
      .split-view { flex-direction: column; }
      .browse-pane {
        width: 100%;
        max-height: 38vh;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
    }
    h2.page-title {
      margin: 0 0 0.45rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--heading);
      letter-spacing: 0.01em;
    }
    h3.sub {
      margin: 0.85rem 0 0.3rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .lede {
      margin: 0 0 0.65rem;
      color: var(--text-secondary);
      font-size: 0.8rem;
      max-width: 44rem;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 0.45rem 0.6rem;
      margin-bottom: 0.5rem;
    }
    .panel:last-child { margin-bottom: 0; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.15rem;
      margin: 0 0 0.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.25rem;
    }
    .tab {
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      font: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.22rem 0.5rem;
      border-radius: 2px 2px 0 0;
      cursor: pointer;
    }
    .tab:hover { color: var(--text); background: var(--surface-hover); }
    .tab.active {
      color: var(--heading);
      background: var(--surface);
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    .tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 500;
      padding: 0.05rem 0.3rem;
      border-radius: 2px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      vertical-align: middle;
    }
    .tag-health { color: var(--health-ok); border-color: rgba(143, 170, 138, 0.35); }
    .tag-role {
      color: var(--link);
      border-color: rgba(158, 182, 208, 0.28);
      background: rgba(158, 182, 208, 0.06);
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 2px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    th, td {
      text-align: left;
      padding: 0.22rem 0.45rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: var(--bg-elevated);
      white-space: nowrap;
      position: relative;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(158, 182, 208, 0.03); }
    .mono {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.74rem;
    }
    dl.kv {
      display: grid;
      grid-template-columns: 7.5rem 1fr;
      gap: 0.15rem 0.65rem;
      margin: 0;
      align-items: baseline;
      font-size: 0.78rem;
    }
    dl.kv dt {
      color: var(--text-secondary);
      font-size: 0.72rem;
      font-weight: 500;
      margin: 0;
    }
    dl.kv dd { margin: 0; word-break: break-word; }
    .stat-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1.1rem;
      font-size: 0.78rem;
      margin: 0 0 0.35rem;
    }
    .stat-row .k { color: var(--text-secondary); margin-right: 0.25rem; }
    .loading, .muted { color: var(--text-secondary); }
    .err { color: var(--err); }
    .small { font-size: 0.72rem; }
    code.inline-code, .code {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.85em;
      background: var(--bg);
      padding: 0.05em 0.28em;
      border-radius: 2px;
      border: 1px solid var(--border);
    }
    pre {
      background: var(--bg);
      padding: 0.45rem 0.55rem;
      overflow: auto;
      border-radius: 2px;
      font-size: 0.7rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      border: 1px solid var(--border);
      max-height: 280px;
      margin: 0.35rem 0 0;
    }
    details.raw { margin-top: 0.35rem; }
    details.raw summary {
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.72rem;
    }
    .btn {
      display: inline-block;
      padding: 0.22rem 0.55rem;
      border-radius: 2px;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { border-color: var(--border-accent); background: var(--surface-hover); }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      margin: 0.35rem 0;
    }
    .form-row label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-right: 0.1rem;
    }
    .form-row input,
    .form-row select {
      font: inherit;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.75rem;
      padding: 0.22rem 0.4rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--bg);
      color: var(--text);
      min-width: 12rem;
      max-width: min(36rem, 100%);
    }
    .form-row select {
      min-width: 16rem;
    }
    .filterable { margin-bottom: 0.5rem; }
    .list-filter {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0 0 0.3rem;
    }
    .list-filter input[type="search"] {
      flex: 1;
      min-width: 0;
      max-width: 28rem;
      font: inherit;
      font-size: 0.75rem;
      padding: 0.22rem 0.45rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--bg);
      color: var(--text);
    }
    .list-filter input[type="search"]:focus {
      outline: none;
      border-color: var(--border-accent);
    }
    .list-filter-count {
      font-size: 0.68rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .filterable tr[hidden],
    .filterable dt[hidden],
    .filterable dd[hidden],
    .filterable .filter-line[hidden] {
      display: none !important;
    }
    .scan-line { font-size: 0.75rem; color: var(--text-secondary); margin: 0.25rem 0 0; }
    .tree-name { white-space: nowrap; }
    @media (max-width: 720px) {
      .shell { flex-direction: column; height: auto; overflow: visible; }
      .sidebar {
        width: 100%;
        max-height: 42vh;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      .sidebar-resizer { display: none; }
      .main-col { overflow: visible; }
      #app { overflow: visible; }
    }
  </style>
  <script>
    try {
      var z = parseFloat(localStorage.getItem('zfstool.uiZoom'));
      if (isFinite(z) && z >= 0.7 && z <= 2) {
        document.documentElement.style.setProperty('--ui-zoom', String(z));
      }
    } catch (e) {}
  </script>
</head>
<body data-github-repo="https://github.com/nixomose/zfstool">
  <div class="shell">
    <aside class="sidebar" aria-label="Navigation">
      <div class="sidebar-brand">
        <a href="#/">zfstool</a>
        <span class="conn-pill" id="conn-pill" title="Remote hostname">…</span>
      </div>
      <div class="sidebar-scroll" id="sidebar-nav">
        <p class="nav-empty">Loading…</p>
      </div>
    </aside>
    <div
      class="sidebar-resizer"
      id="sidebar-resizer"
      role="separator"
      aria-orientation="vertical"
      aria-label="Resize navigation"
      tabindex="0"
    ></div>
    <div class="main-col">
      <div class="topbar">
        <div class="topbar-meta" id="topbar-meta">Read-only ZFS inventory</div>
        <button type="button" class="btn-exit" id="btn-native-exit" hidden>Exit</button>
      </div>
      <nav id="crumb" aria-label="Breadcrumb">
        <button type="button" class="crumb-back" id="crumb-back" disabled title="Previous view">Back</button>
        <span id="crumb-path"></span>
      </nav>
      <main id="app"></main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
