<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>zfstool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0e0f12;
      --bg-elevated: #13151a;
      --surface: #181b22;
      --surface-hover: #1f232c;
      --border: #2a303a;
      --border-accent: #3a4454;
      --text: #e4e2dd;
      --text-secondary: #949089;
      --accent: #b8956c;
      --link: #9eb6d0;
      --link-hover: #c5d6e8;
      --heading: #f0ede6;
      --err: #c97a7a;
      --health-ok: #8faa8a;
      --sidebar-w: 272px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
      font-size: 13px;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { color: var(--link-hover); text-decoration: underline; }
    .shell {
      display: flex;
      min-height: 100%;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-brand {
      padding: 0.55rem 0.7rem 0.45rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.4rem;
    }
    .sidebar-brand a {
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      color: var(--heading);
      text-decoration: none;
    }
    .sidebar-brand a:hover { color: var(--accent); text-decoration: none; }
    .conn-pill {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 7.5rem;
    }
    .conn-pill a { color: inherit; }
    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0.35rem 0 0.75rem;
    }
    .nav-static {
      padding: 0.15rem 0.45rem 0.35rem;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .nav-link {
      display: block;
      padding: 0.22rem 0.45rem;
      border-radius: 2px;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 500;
    }
    .nav-link:hover { background: var(--surface-hover); text-decoration: none; color: var(--heading); }
    .nav-link.active { background: var(--surface); color: var(--heading); box-shadow: inset 2px 0 0 var(--accent); }
    .nav-section { margin-top: 0.2rem; }
    .nav-section-head {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      width: 100%;
      padding: 0.28rem 0.5rem;
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      font: inherit;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      text-align: left;
    }
    .nav-section-head:hover { color: var(--text); }
    .nav-chevron {
      display: inline-block;
      width: 0.7rem;
      font-size: 0.6rem;
      color: var(--accent);
    }
    .nav-section-body { padding: 0 0.25rem 0.25rem 0.35rem; }
    .nav-item {
      display: block;
      padding: 0.18rem 0.4rem;
      border-radius: 2px;
      font-size: 0.78rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-item:hover { background: var(--surface-hover); text-decoration: none; color: var(--heading); }
    .nav-item.active { background: var(--surface); color: var(--heading); box-shadow: inset 2px 0 0 var(--accent); }
    .nav-item-row {
      display: flex;
      align-items: stretch;
      gap: 0;
    }
    .nav-item-row .nav-twist {
      flex-shrink: 0;
      width: 1.1rem;
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.55rem;
      padding: 0;
    }
    .nav-item-row .nav-twist:hover { color: var(--accent); }
    .nav-item-row .nav-item { flex: 1; min-width: 0; }
    .nav-kids {
      margin: 0 0 0.15rem 1.1rem;
      padding: 0.1rem 0 0.15rem 0.35rem;
      border-left: 1px solid var(--border);
      font-size: 0.72rem;
    }
    .nav-kids a {
      display: block;
      padding: 0.12rem 0.3rem;
      color: var(--link);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .nav-kids .smart-snip {
      display: block;
      padding: 0.15rem 0.3rem 0.25rem;
      color: var(--text-secondary);
      line-height: 1.35;
      white-space: normal;
    }
    .nav-kids .smart-snip .ok { color: var(--health-ok); }
    .nav-kids .smart-snip .bad { color: var(--err); }
    .nav-empty { padding: 0.2rem 0.5rem; color: var(--text-secondary); font-size: 0.75rem; }
    .main-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.35rem 0.75rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
    }
    .topbar-meta {
      font-size: 0.72rem;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-exit {
      flex-shrink: 0;
      padding: 0.2rem 0.55rem;
      font-family: inherit;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 2px;
      cursor: pointer;
    }
    .btn-exit:hover { color: var(--text); border-color: var(--border-accent); }
    .btn-exit[hidden] { display: none !important; }
    #crumb {
      flex-shrink: 0;
      padding: 0.28rem 0.75rem;
      font-size: 0.72rem;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    #crumb.crumb--hidden { display: none; }
    .crumb-link { color: var(--link); }
    .crumb-here { color: var(--text); font-weight: 500; }
    .crumb-sep { color: var(--border-accent); margin: 0 0.12em; }
    #app {
      flex: 1;
      overflow: auto;
      padding: 0.65rem 0.85rem 1.5rem;
    }
    h2.page-title {
      margin: 0 0 0.45rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--heading);
      letter-spacing: 0.01em;
    }
    h3.sub {
      margin: 0.85rem 0 0.3rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .lede {
      margin: 0 0 0.65rem;
      color: var(--text-secondary);
      font-size: 0.8rem;
      max-width: 44rem;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 0.45rem 0.6rem;
      margin-bottom: 0.5rem;
    }
    .panel:last-child { margin-bottom: 0; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.15rem;
      margin: 0 0 0.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.25rem;
    }
    .tab {
      border: 0;
      background: transparent;
      color: var(--text-secondary);
      font: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.22rem 0.5rem;
      border-radius: 2px 2px 0 0;
      cursor: pointer;
    }
    .tab:hover { color: var(--text); background: var(--surface-hover); }
    .tab.active {
      color: var(--heading);
      background: var(--surface);
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    .tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 500;
      padding: 0.05rem 0.3rem;
      border-radius: 2px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      vertical-align: middle;
    }
    .tag-health { color: var(--health-ok); border-color: rgba(143, 170, 138, 0.35); }
    .tag-role {
      color: var(--link);
      border-color: rgba(158, 182, 208, 0.28);
      background: rgba(158, 182, 208, 0.06);
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 2px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    th, td {
      text-align: left;
      padding: 0.22rem 0.45rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.65rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: var(--bg-elevated);
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(158, 182, 208, 0.03); }
    .mono {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.74rem;
    }
    dl.kv {
      display: grid;
      grid-template-columns: 7.5rem 1fr;
      gap: 0.15rem 0.65rem;
      margin: 0;
      align-items: baseline;
      font-size: 0.78rem;
    }
    dl.kv dt {
      color: var(--text-secondary);
      font-size: 0.72rem;
      font-weight: 500;
      margin: 0;
    }
    dl.kv dd { margin: 0; word-break: break-word; }
    .stat-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1.1rem;
      font-size: 0.78rem;
      margin: 0 0 0.35rem;
    }
    .stat-row .k { color: var(--text-secondary); margin-right: 0.25rem; }
    .loading, .muted { color: var(--text-secondary); }
    .err { color: var(--err); }
    .small { font-size: 0.72rem; }
    code.inline-code, .code {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.85em;
      background: var(--bg);
      padding: 0.05em 0.28em;
      border-radius: 2px;
      border: 1px solid var(--border);
    }
    pre {
      background: var(--bg);
      padding: 0.45rem 0.55rem;
      overflow: auto;
      border-radius: 2px;
      font-size: 0.7rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      border: 1px solid var(--border);
      max-height: 280px;
      margin: 0.35rem 0 0;
    }
    details.raw { margin-top: 0.35rem; }
    details.raw summary {
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.72rem;
    }
    .btn {
      display: inline-block;
      padding: 0.22rem 0.55rem;
      border-radius: 2px;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { border-color: var(--border-accent); background: var(--surface-hover); }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      margin: 0.35rem 0;
    }
    .form-row label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-right: 0.1rem;
    }
    .form-row input,
    .form-row select {
      font: inherit;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.75rem;
      padding: 0.22rem 0.4rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--bg);
      color: var(--text);
      min-width: 12rem;
      max-width: min(36rem, 100%);
    }
    .form-row select {
      min-width: 16rem;
    }
    .filterable { margin-bottom: 0.5rem; }
    .list-filter {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0 0 0.3rem;
    }
    .list-filter input[type="search"] {
      flex: 1;
      min-width: 0;
      max-width: 28rem;
      font: inherit;
      font-size: 0.75rem;
      padding: 0.22rem 0.45rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--bg);
      color: var(--text);
    }
    .list-filter input[type="search"]:focus {
      outline: none;
      border-color: var(--border-accent);
    }
    .list-filter-count {
      font-size: 0.68rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .filterable tr[hidden],
    .filterable dt[hidden],
    .filterable dd[hidden],
    .filterable .filter-line[hidden] {
      display: none !important;
    }
    .scan-line { font-size: 0.75rem; color: var(--text-secondary); margin: 0.25rem 0 0; }
    .tree-name { white-space: nowrap; }
    @media (max-width: 720px) {
      .shell { flex-direction: column; height: auto; overflow: visible; }
      .sidebar {
        width: 100%;
        max-height: 42vh;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      .main-col { overflow: visible; }
      #app { overflow: visible; }
    }
  </style>
</head>
<body data-github-repo="https://github.com/nixomose/zfstool">
  <div class="shell">
    <aside class="sidebar" aria-label="Navigation">
      <div class="sidebar-brand">
        <a href="#/">zfstool</a>
        <span class="conn-pill" id="conn-pill" title="Remote hostname">…</span>
      </div>
      <div class="sidebar-scroll" id="sidebar-nav">
        <p class="nav-empty">Loading…</p>
      </div>
    </aside>
    <div class="main-col">
      <div class="topbar">
        <div class="topbar-meta" id="topbar-meta">Read-only ZFS inventory</div>
        <button type="button" class="btn-exit" id="btn-native-exit" hidden>Exit</button>
      </div>
      <nav id="crumb" class="crumb--hidden" aria-label="Breadcrumb"></nav>
      <main id="app"></main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
